note: >-
  Elastic Observability's client surface is two generations of agent. The classic Elastic APM
  agents (elastic-apm-*, co.elastic.apm) speak the /intake/v2 event API in this repo's OpenAPI;
  the Elastic Distributions of OpenTelemetry (EDOT, co.elastic.otel / @elastic/opentelemetry-node
  / elastic-opentelemetry) speak the OTLP endpoints in the same spec. Both are first party.
  Maven Central versions were read from repo1.maven.org maven-metadata.xml because the
  search.maven.org solr index is stale (it still reported elastic-otel-javaagent 1.4.1 / 2025-04-16
  against an actual 1.12.0 / 2026-07-31).
