specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Elastic Observability
providerId: elastic-observability
created: '2026-05-04'
modified: '2026-08-29'
generated: '2026-08-29'
method: searched
source: https://www.elastic.co/pricing/serverless-observability
docs:
- https://www.elastic.co/pricing/serverless-observability
- https://www.elastic.co/pricing
replaces: >-
  A bulk-sweep scaffold dated 2026-05-04 that invented a Free / Professional / Enterprise ladder
  with 1,000 and 100,000 request quotas and "TBD" prices. Elastic does not price this product per
  API request at all — it prices per GB ingested, retained and egressed — so every number in that
  scaffold was wrong in kind, not just in value. Replaced wholesale on 2026-08-29.
tags:
- AIOps
- Observability
description: >-
  Elastic Observability Serverless pricing, read from Elastic's published pricing page. Billing is
  usage-based per GB rather than per API call, which is why no request quota or per-request overage
  appears below. Elastic Cloud Hosted prices on provisioned resources and self-managed licenses per
  node/RAM; both are separate ladders from the serverless one recorded here.
billing_model: usage-based (per GB ingested, retained, and egressed)
currency: USD
deployment_models:
- name: Serverless
  basis: Usage based pricing. Pay as you go (monthly) or prepaid.
  priced_here: true
- name: Hosted
  basis: Resource based pricing. Pay as you go (monthly) or prepaid.
  priced_here: false
- name: Self-managed
  basis: Licensing based on number of nodes and used RAM.
  priced_here: false
