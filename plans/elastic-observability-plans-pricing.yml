sla:
  note: >-
    Elastic publishes a 99.95% Monthly Uptime SLA for the Platinum and Enterprise subscription
    tiers. Those tier names belong to the Elastic Cloud Hosted / support ladder, not to the two
    serverless Observability tiers above, and Elastic does not print their prices on
    https://www.elastic.co/pricing — recorded as an unpriced fact rather than folded into a tier.
trial:
