provider: Elastic Observability
providerId: elastic-observability
headline: >-
  Elastic Observability's MCP surface and its published OpenAPI surface do not overlap at all.
  The OpenAPI in this repo is the APM Server *intake* contract — the write path telemetry agents
  use to push events in. The Agent Builder MCP tools are all *read* tools over telemetry that has
  already landed in Elasticsearch, and they are backed by Kibana APIs Elastic does not publish as
  OpenAPI in the Observability Intake document. Crosswalk coverage is therefore 0 by fact, not by
  omission — an agent cannot reach the intake API through MCP, and cannot reach the analysis tools
  through this OpenAPI.
surfaces:
  openapi:
  - openapi/elastic-observability-server-info-api-openapi.yml
  - openapi/elastic-observability-agent-config-api-openapi.yml
  - openapi/elastic-observability-event-intake-api-openapi.yml
  - openapi/elastic-observability-opentelemetry-intake-api-openapi.yml
  openapi_gated: false
  graphql: null
  mcp: https://{KIBANA_URL}/api/agent_builder/mcp
  mcp_gated: true
  mcp_gate_note: >-
    Per-customer Kibana host + Elastic API key. tools/list cannot be called anonymously, so tool
    inputSchemas were not introspected and every binding below is by name and documented semantics.
