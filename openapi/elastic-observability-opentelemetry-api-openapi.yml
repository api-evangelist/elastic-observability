openapi: 3.1.0
info:
  title: Elastic Observability (APM Server) Agent Configuration OpenTelemetry API
  version: 8.x
  description: Elastic Observability exposes the APM Server intake and configuration APIs used by APM agents and the OpenTelemetry / Jaeger compatibility paths to deliver logs, metrics, and traces into the Elastic Stack.
  contact:
    name: Elastic
    url: https://www.elastic.co/guide/en/observability/current/index.html
servers:
- url: https://{host}:{port}
  description: APM Server
  variables:
    host:
      default: localhost
    port:
      default: '8200'
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: OpenTelemetry
paths:
  /opentelemetry.proto.collector.trace.v1.TraceService/Export:
    post:
      summary: OTLP traces ingest (HTTP)
      description: OpenTelemetry OTLP traces intake endpoint.
      operationId: otlpTracesExport
      tags:
      - OpenTelemetry
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Accepted
  /opentelemetry.proto.collector.metrics.v1.MetricsService/Export:
    post:
      summary: OTLP metrics ingest (HTTP)
      operationId: otlpMetricsExport
      tags:
      - OpenTelemetry
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Accepted
  /opentelemetry.proto.collector.logs.v1.LogsService/Export:
    post:
      summary: OTLP logs ingest (HTTP)
      operationId: otlpLogsExport
      tags:
      - OpenTelemetry
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Secret token
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
