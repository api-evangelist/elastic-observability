openapi: 3.1.0
info:
  title: Elastic Observability (APM Server) Agent Configuration Server Info API
  version: 8.x
  description: Elastic Observability exposes the APM Server intake and configuration APIs used by APM agents and the OpenTelemetry / Jaeger compatibility paths to deliver logs, metrics, and traces into the Elastic Stack.
  contact:
    name: Elastic
    url: https://www.elastic.co/guide/en/observability/current/index.html
servers:
- url: https://{host}:{port}
  description: APM Server
  variables:
    host:
      default: localhost
    port:
      default: '8200'
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Server Info
paths:
  /:
    get:
      summary: Server information
      description: Returns build/version information for the APM Server.
      operationId: serverInfo
      tags:
      - Server Info
      responses:
        '200':
          description: Server info
          content:
            application/json:
              schema:
                type: object
                properties:
                  build_date:
                    type: string
                  build_sha:
                    type: string
                  publish_ready:
                    type: boolean
                  version:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Secret token
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
