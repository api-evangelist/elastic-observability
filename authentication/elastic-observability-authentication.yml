schemes:
- name: apiKeyAuth
  type: apiKey
  in: header
  parameter: Authorization
  description: 'e.g. Authorization: ApiKey base64AccessApiKey'
  sources:
  - openapi/elastic-observability-agent-config-api-openapi.yml
