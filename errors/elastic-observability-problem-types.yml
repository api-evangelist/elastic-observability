format_note: >-
  Not RFC 9457. The contract declares no application/problem+json response and no error envelope
  schema is bound to any response. It does define a component schema named `error` — but that is
  the APM *error event* an agent SENDS IN on /intake/v2/events (an application exception captured
  by an agent), not an API error the server returns. Conflating the two would be wrong.
coverage_note: >-
  The published contract declares only two non-2xx responses across 14 operations, both on POST
  /config/v1/agents. Every intake operation declares 202 only, and every OTLP operation declares
  200 only — so the documented failure surface for the entire telemetry write path is empty. This
  is a real gap in the contract, not a gap in this harvest.
