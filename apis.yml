  name: Elastic Observability opentelemetry intake API
  description: 'The OpenTelemetry intake API uses the OpenTelemetry Protocol (OTLP) to send traces, metrics,
    and logs to APM Server. OTLP is the default transfer protocol for OpenTelemetry and is supported natively
    by APM Server. APM Server supports two OTLP communication protocols on the same port: OTLP/HTTP (protobuf)
    and OTLP/gRPC.'
