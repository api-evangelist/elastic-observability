aid: elastic-observability
name: Elastic Observability
description: 'Elastic Observability is Elastic''s unified logs, metrics, traces and profiling solution,
  built on the Elastic Stack. Its published machine-readable contract is the Observability Intake API
  served by APM Server: a newline-delimited JSON event intake for Elastic APM agents, a central agent-configuration
  endpoint, and native OpenTelemetry Protocol ingest over both OTLP/HTTP and OTLP/gRPC. Analysis of the
  telemetry once it has landed happens through Kibana and, for agents, through the Elastic Agent Builder
  MCP server, which exposes sixteen observability.* tools over a deployment-scoped endpoint.'
