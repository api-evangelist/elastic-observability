  version: v0.126.1
  released: '2026-08-27'
  role: Build, test and lint Elastic integration packages; spins up a local test stack.
  audience: integration developers, not API consumers
- name: ecctl
  primary: false
  repo: https://github.com/elastic/ecctl
  version: v1.15.0
  released: '2025-06-13'
  role: Elastic Cloud Control — manage Elastic Cloud deployments from the command line.
  note: >-
    Last release 2025-06-13, over fourteen months before this pass. Recorded as a currency signal,
    not as a claim that Elastic has retired it.
- name: apm-server
  primary: false
  repo: https://github.com/elastic/apm-server
  role: >-
    The APM Server binary itself — the process that SERVES the OpenAPI in this repo. Run
    standalone for self-managed deployments; on Elastic Cloud it is managed for you.
  note: >-
    Listed for completeness because it is the server side of this contract, not a client tool.
    No release version recorded here — APM Server ships on the Elastic Stack version train
    (currently 9.5.2), not on its own.
