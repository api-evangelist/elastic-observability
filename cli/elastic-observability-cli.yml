note: >-
  Elastic ships no single "observability CLI". What exists is a set of first-party binaries, each
  owning one job, and the versions below were read from the GitHub releases API on 2026-08-29 —
  which is also how the abandonment signal on ecctl surfaced.
clis:
- name: elastic-agent
  primary: true
  repo: https://github.com/elastic/elastic-agent
  version: v9.5.2
  released: '2026-08-20'
  role: >-
    The single agent that ships logs, metrics, traces and security data to Elastic. As of Stack
    9.5.0 the EDOT Collector is folded into elastic-agent rather than shipped separately, so this
    binary is now also the OpenTelemetry collector that talks to the OTLP paths in this repo's
    OpenAPI.
  install:
  - Download the platform archive from https://www.elastic.co/downloads/elastic-agent
  - Fleet-managed enrollment from Kibana
  - Docker / Kubernetes (DaemonSet) manifests
  commands:
  - install — enroll and install the agent as a service
  - enroll — enroll an installed agent with Fleet
  - run — run the agent in the foreground
  - status — report agent and component health
  - diagnostics — collect a diagnostics bundle
  - inspect — print the resolved configuration
  - upgrade — upgrade the agent to a given version
